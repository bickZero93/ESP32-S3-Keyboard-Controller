name: Fix README images v1.13.10

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract embedded webinterface
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, re, pathlib, sys
          ino = pathlib.Path('keyboard_controller.ino').read_text(encoding='utf-8', errors='ignore')
          blocks = re.findall(r'\{([^{}]{1000,}?)\}\s*;', ino, flags=re.S)
          found = None
          for block in blocks:
              toks = re.findall(r'0x[0-9A-Fa-f]{1,2}|\b\d{1,3}\b', block)
              if not toks: continue
              try: data = bytes(int(t,16) if t.lower().startswith('0x') else int(t) for t in toks)
              except (ValueError, OverflowError): continue
              for m in re.finditer(b'\x1f\x8b', data):
                  try: raw = gzip.decompress(data[m.start():])
                  except Exception: continue
                  if b'<html' in raw[:4096].lower() or b'<!doctype html' in raw[:4096].lower():
                      found = raw; break
              if found is not None: break
          if found is None: sys.exit('Embedded gzip HTML not found')
          pathlib.Path('/tmp/index.html').write_bytes(found)
          PY

      - name: Install Chromium renderer
        run: |
          npm --silent --no-progress init -y >/dev/null 2>&1
          npm --silent --no-progress install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Render screenshots
        run: |
          mkdir -p docs/images
          cat > /tmp/render.mjs <<'JS'
          import { chromium } from 'playwright';
          import { pathToFileURL } from 'url';
          const browser = await chromium.launch({headless:true});
          const url = pathToFileURL('/tmp/index.html').href;
          async function shot(width,height,out,mobile=false){
            const context=await browser.newContext({viewport:{width,height},screen:{width,height},deviceScaleFactor:1,isMobile:mobile,hasTouch:mobile});
            const page=await context.newPage();
            await page.goto(url,{waitUntil:'load'}); await page.waitForTimeout(1500);
            await page.screenshot({path:out,fullPage:true,animations:'disabled'}); await context.close();
          }
          await shot(1440,1000,'docs/images/webinterface-desktop.png');
          await shot(390,844,'docs/images/webinterface-mobile.png',true);
          await browser.close();
          JS
          node /tmp/render.mjs
          test -s docs/images/webinterface-desktop.png
          test -s docs/images/webinterface-mobile.png

      - name: Repair README
        run: |
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('README.md'); s=p.read_text(encoding='utf-8')
          block='''## Webinterface\n\n### Desktop\n\n![ESP32-S3 HID Controller – Webinterface Desktop](./docs/images/webinterface-desktop.png)\n\n### Mobile\n\n![ESP32-S3 HID Controller – Webinterface Mobile](./docs/images/webinterface-mobile.png)\n\nDas Webinterface ist direkt in der Firmware gzip-komprimiert eingebettet. Die Abbildungen wurden aus der aktuell veröffentlichten Firmware gerendert.\n\n## Highlights'''
          s,n=re.subn(r'## Webinterface\s+.*?\n## Highlights',block,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('README Webinterface section not found')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit generated files to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/images/webinterface-desktop.png docs/images/webinterface-mobile.png
          git rm --ignore-unmatch docs/images/webinterface-desktop.webp docs/images/webinterface-mobile.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: add working README screenshots'
          git push origin HEAD:${{ github.head_ref }}
